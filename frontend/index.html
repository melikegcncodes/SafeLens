<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeLens</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <div class="logo">🛡️</div>

        <h1>SafeLens</h1>

        <p class="subtitle">
            Phishing ve dolandırıcılık mesajlarını analiz edin.
        </p>

        <textarea
            id="message"
            placeholder="Şüpheli mesajı veya bağlantıyı buraya yapıştırın..."
        ></textarea>

        <div class="actions">
    <button id="analyzeButton" onclick="analyzeMessage()">
        Analiz Et
    </button>

    <button class="clear-button" onclick="clearAnalysis()">
        Temizle
    </button>
</div>

        <div id="result" class="result hidden">

            <h2>Analiz Sonucu</h2>

           <div class="score">
    <span id="riskScore">0</span>/100
</div>

<div class="progress">
    <div id="progressBar" class="progress-bar"></div>
</div>

<div id="riskLevel" class="level">
    LOW
</div>
<div id="summaryCard" class="summary-card"></div>
           <h3>Risk Analizi</h3>

<div id="riskDetails" class="risk-details"></div>
        </div>

    </div>

    <script src="/static/app.js"></script>

</body>
</html>
